name: Adjust HOODBTC favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply official HOODBTC favicon everywhere
        run: |
          set -euo pipefail
          cp favicon.png hoodbtc-favicon.png
          find . -type f -name '*.html' -print0 | xargs -0 sed -i 's#/favicon\.png#/hoodbtc-favicon.png#g'
          rm -f .github/workflows/adjust-hoodbtc-logo.yml
      - name: Commit favicon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix HOODBTC logo favicon across all pages"
          git push origin main
