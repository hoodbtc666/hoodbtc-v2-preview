name: Adjust HOODBTC favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply official HOODBTC favicon everywhere
        shell: bash
        run: |
          set -euo pipefail
          cp favicon.png hoodbtc-favicon.png
          while IFS= read -r -d '' f; do
            python3 - "$f" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          # Remove older HOODBTC favicon tags so every page has one consistent set.
          s = re.sub(r'\s*<link[^>]+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>\s*', '\n', s, flags=re.I)
          block = '''  <link rel="icon" type="image/png" sizes="48x48" href="/hoodbtc-favicon.png">
  <link rel="shortcut icon" type="image/png" href="/hoodbtc-favicon.png">
  <link rel="apple-touch-icon" href="/hoodbtc-favicon.png">
'''
          s = s.replace('</head>', block + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          done < <(find . -type f -name '*.html' -print0)
          rm -f .github/workflows/adjust-hoodbtc-logo.yml
      - name: Commit favicon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix HOODBTC logo favicon across all pages"
          git push origin main
