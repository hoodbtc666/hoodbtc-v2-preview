name: Apply HOODBTC favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-favicon:
    if: github.event.head_commit.message != 'Apply official HOODBTC favicon'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply official favicon to every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          favicon_b64 = ""

          favicon = Path("favicon.png")
          favicon.write_bytes(base64.b64decode(favicon_b64))

          icon_tags = (
              '  <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">\n'
              '  <link rel="shortcut icon" type="image/png" href="/favicon.png">\n'
              '  <link rel="apple-touch-icon" href="/favicon.png">\n'
          )

          rel_pattern = re.compile(
              r'^[ \t]*<link\b(?=[^>]*\brel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'])[^>]*>\s*\n?',
              flags=re.IGNORECASE | re.MULTILINE,
          )

          changed = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              new = rel_pattern.sub('', text)
              lower = new.lower()
              pos = lower.find('</head>')
              if pos == -1:
                  continue
              new = new[:pos] + icon_tags + new[pos:]
              if new != text:
                  html.write_text(new, encoding='utf-8')
                  changed += 1

          workflow = Path('.github/workflows/apply-hoodbtc-favicon.yml')
          if workflow.exists():
              workflow.unlink()

          print(f'Updated favicon links in {changed} HTML files')
          PY

          git config user.name "hoodbtc666"
          git config user.email "peterhazim96@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No favicon changes needed"
            exit 0
          fi
          git commit -m "Apply official HOODBTC favicon"
          git push
